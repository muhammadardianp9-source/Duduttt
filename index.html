<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Ayu Wulandari</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffe6eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(255, 105, 180, 0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 2px solid #ffb6c1;
        }

        .img-container {
            width: 180px;
            height: 180px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 5px solid #ff69b4;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            color: #d81b60;
            font-size: 1.5rem;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        p {
            color: #555555;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .heart-btn {
            background-color: #ff4081;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 10px rgba(255, 64, 129, 0.4);
        }

        .heart-btn:hover {
            background-color: #f50057;
            transform: scale(1.05);
        }

        /* Pesan tersembunyi */
        .secret-message {
            display: none;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px dashed #ffb6c1;
            color: #c2185b;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Ganti 'foto-ayu.jpg' dengan nama atau URL foto Ayu Wulandari -->
        <div class="img-container">
            <img src="" alt="IMG-20260818-WA0042.jpg" id="profile-img">
        </div>

        <h1>Iloveyou dudut sayangku AYU WULANDARI ❤️</h1>

        <p>Terima kasih sudah selalu ada dan menjadi alasan di balik senyumku setiap hari.</p>

        <button class="heart-btn" onclick="toggleMessage()">Klik di sini 💌</button>

        <div class="secret-message" id="extra-message">
            Kamu adalah hal terindah dalam hidupku! 🥰✨
        </div>
    </div>

    <script>
        function toggleMessage() {
            var msg = document.getElementById("extra-message");
            if (msg.style.display === "none" || msg.style.display === "") {
                msg.style.display = "block";
            } else {
                msg.style.display = "none";
            }
        }
    </script>

</body>
</html>
